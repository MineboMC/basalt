repositories {
    mavenCentral()
}

dependencies {
    implementation project(":commons")

    // framework
    implementation("net.dv8tion:JDA:5.0.0-beta.20")

    // configurations
    implementation("me.carleslc:Simple-Yaml:1.8.4")

    //local files
    implementation fileTree(include: ['amber-1.1.0.jar'], dir: 'lib')
}

jar {
    manifest {
        attributes(
                'Main-Class': 'net.minebo.discord.BasaltDiscordBot'
        )
    }
}
